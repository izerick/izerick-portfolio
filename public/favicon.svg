<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Isometric Minecraft Grass Block -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Side Left (Dirt + Grass Overlay) -->
  <!-- Dirt background left -->
  <path d="M 2,10 L 16,18 L 16,30 L 2,22 Z" fill="#79553a"/>
  <!-- Dirt texture spots left -->
  <path d="M 4,14 L 6,15 L 6,17 L 4,16 Z" fill="#573d26"/>
  <path d="M 8,18 L 11,20 L 11,22 L 8,20 Z" fill="#573d26"/>
  <path d="M 12,22 L 14,23 L 14,25 L 12,24 Z" fill="#8d6e53"/>
  <path d="M 4,19 L 6,20 L 6,22 L 4,21 Z" fill="#8d6e53"/>
  <path d="M 7,24 L 10,26 L 10,28 L 7,26 Z" fill="#573d26"/>
  <!-- Grass overlay on left side -->
  <path d="M 2,10 L 16,18 L 16,21 L 14,20 L 14,22 L 11,20 L 11,23 L 9,22 L 9,24 L 6,22 L 6,20 L 4,21 L 4,19 L 2,18 Z" fill="#5b8e32"/>
  <path d="M 2,10 L 16,18 L 16,19 L 14,18 L 14,19 L 11,18 L 11,20 L 9,19 L 9,21 L 6,19 L 6,18 L 4,19 L 4,17 L 2,16 Z" fill="#71a73b"/>

  <!-- Side Right (Darker Dirt + Grass Overlay) -->
  <!-- Dirt background right -->
  <path d="M 16,18 L 30,10 L 30,22 L 16,30 Z" fill="#5d3f28"/>
  <!-- Dirt texture spots right -->
  <path d="M 18,22 L 20,21 L 20,23 L 18,24 Z" fill="#432c1b"/>
  <path d="M 22,18 L 25,16 L 25,18 L 22,20 Z" fill="#755034"/>
  <path d="M 26,14 L 28,13 L 28,15 L 26,16 Z" fill="#432c1b"/>
  <path d="M 23,23 L 26,21 L 26,23 L 23,25 Z" fill="#432c1b"/>
  <path d="M 18,26 L 21,24 L 21,26 L 18,28 Z" fill="#755034"/>
  <!-- Grass overlay on right side -->
  <path d="M 16,18 L 30,10 L 30,18 L 28,19 L 28,17 L 26,18 L 26,21 L 23,19 L 23,22 L 21,21 L 21,23 L 18,21 L 18,19 L 16,20 Z" fill="#486e26"/>
  <path d="M 16,18 L 30,10 L 30,15 L 28,16 L 28,15 L 26,16 L 26,18 L 23,17 L 23,19 L 21,18 L 21,20 L 18,19 L 18,18 L 16,19 Z" fill="#5b8e32"/>

  <!-- Top Face (Lush Grass Diamond) -->
  <path d="M 16,2 L 30,10 L 16,18 L 2,10 Z" fill="#7dbc38"/>
  <!-- Top Grass Pixel Details -->
  <path d="M 16,4 L 19,6 L 16,8 L 13,6 Z" fill="#8cd63f"/>
  <path d="M 10,7 L 13,9 L 10,11 L 7,9 Z" fill="#69a32c"/>
  <path d="M 22,7 L 25,9 L 22,11 L 19,9 Z" fill="#8cd63f"/>
  <path d="M 16,10 L 19,12 L 16,14 L 13,12 Z" fill="#69a32c"/>
  <path d="M 7,8 L 10,10 L 7,12 L 4,10 Z" fill="#8cd63f"/>
  <path d="M 25,8 L 28,10 L 25,12 L 22,10 Z" fill="#69a32c"/>
  <path d="M 16,14 L 19,16 L 16,18 L 13,16 Z" fill="#8cd63f"/>
</svg>
